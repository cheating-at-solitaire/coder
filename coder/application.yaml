apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.coder.com/v2
      chart: coder
      targetRevision: 2.x.x   # pin to a real current version, see note below
      helm:
        valueFiles:
          - $values/coder/values.yaml
    - repoURL: https://github.com/cheating-at-solitaire/coder.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: coder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
